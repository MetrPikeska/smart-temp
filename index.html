<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senzor teploty a vlhkosti</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card.large {
            grid-column: span 2;
        }
        
        .sensor-value {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sensor-icon {
            font-size: 3em;
            margin-right: 20px;
        }
        
        .sensor-info h2 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .sensor-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }
        
        .sensor-unit {
            font-size: 0.8em;
            color: #999;
            margin-left: 5px;
        }
        
        .status {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }
        
        .status.online {
            color: #27ae60;
        }
        
        .status.offline {
            color: #e74c3c;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #764ba2;
        }
        
        .loading {
            text-align: center;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ Senzor teploty a vlhkosti</h1>
        
        <div id="errorContainer"></div>
        
        <div class="grid">
            <!-- Teplota -->
            <div class="card">
                <div class="sensor-value">
                    <div class="sensor-icon">🌡️</div>
                    <div class="sensor-info">
                        <h2>Teplota</h2>
                        <div>
                            <span class="sensor-number" id="temperature">--</span>
                            <span class="sensor-unit">°C</span>
                        </div>
                        <div class="status" id="tempStatus">Načítání...</div>
                    </div>
                </div>
            </div>
            
            <!-- Vlhkost -->
            <div class="card">
                <div class="sensor-value">
                    <div class="sensor-icon">💧</div>
                    <div class="sensor-info">
                        <h2>Vlhkost</h2>
                        <div>
                            <span class="sensor-number" id="humidity">--</span>
                            <span class="sensor-unit">%</span>
                        </div>
                        <div class="status" id="humidityStatus">Načítání...</div>
                    </div>
                </div>
            </div>
            
            <!-- Graf -->
            <div class="card large">
                <h2 style="margin-bottom: 20px;">Trend posledních 24 hodin</h2>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
            
            <!-- Statistika -->
            <div class="card large">
                <h2 style="margin-bottom: 20px;">Statistika (24 hodin)</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h3 style="color: #667eea; margin-bottom: 15px;">Teplota</h3>
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-label">Průměr</div>
                                <div class="stat-value" id="statTempAvg">--</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Max</div>
                                <div class="stat-value" id="statTempMax">--</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Min</div>
                                <div class="stat-value" id="statTempMin">--</div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 style="color: #764ba2; margin-bottom: 15px;">Vlhkost</h3>
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-label">Průměr</div>
                                <div class="stat-value" id="statHumAvg">--</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Max</div>
                                <div class="stat-value" id="statHumMax">--</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Min</div>
                                <div class="stat-value" id="statHumMin">--</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div style="text-align: center;">
            <button class="refresh-btn" onclick="loadData()">🔄 Obnovit data</button>
            <p style="color: white; margin-top: 20px; font-size: 0.9em;">Poslední aktualizace: <span id="lastUpdate">--</span></p>
        </div>
    </div>
    
    <script>
        let chart = null;
        
        async function loadData() {
            try {
                // Očistit chyby
                document.getElementById('errorContainer').innerHTML = '';
                
                // Načíst poslední hodnoty
                const latestRes = await fetch('api.php?action=latest');
                const latest = await latestRes.json();
                
                if (latest.error) {
                    showError('Nelze načíst poslední data: ' + latest.error);
                    return;
                }
                
                document.getElementById('temperature').textContent = parseFloat(latest.temperature).toFixed(1);
                document.getElementById('humidity').textContent = parseFloat(latest.humidity).toFixed(1);
                document.getElementById('tempStatus').innerHTML = '✓ Aktuální - ' + new Date(latest.created_at).toLocaleTimeString('cs-CZ');
                document.getElementById('humidityStatus').innerHTML = '✓ Aktuální - ' + new Date(latest.created_at).toLocaleTimeString('cs-CZ');
                
                // Načíst historii
                const historyRes = await fetch('api.php?action=history&hours=24');
                const history = await historyRes.json();
                
                if (!Array.isArray(history)) {
                    showError('Chyba při načítání historie');
                    return;
                }
                
                // Aktualizovat graf
                updateChart(history);
                
                // Načíst statistiku
                const statsRes = await fetch('api.php?action=stats&hours=24');
                const stats = await statsRes.json();
                
                if (stats.error) {
                    showError('Nelze načíst statistiku: ' + stats.error);
                    return;
                }
                
                document.getElementById('statTempAvg').textContent = (stats.temperature.average || '--') + ' °C';
                document.getElementById('statTempMax').textContent = (stats.temperature.max || '--') + ' °C';
                document.getElementById('statTempMin').textContent = (stats.temperature.min || '--') + ' °C';
                document.getElementById('statHumAvg').textContent = (stats.humidity.average || '--') + ' %';
                document.getElementById('statHumMax').textContent = (stats.humidity.max || '--') + ' %';
                document.getElementById('statHumMin').textContent = (stats.humidity.min || '--') + ' %';
                
                // Aktualizovat čas
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('cs-CZ');
                
            } catch (error) {
                showError('Chyba: ' + error.message);
            }
        }
        
        function updateChart(history) {
            const temps = history.map(d => parseFloat(d.temperature).toFixed(1));
            const humidities = history.map(d => parseFloat(d.humidity).toFixed(1));
            const times = history.map(d => new Date(d.created_at).toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit'}));
            
            const ctx = document.getElementById('tempChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: times,
                    datasets: [
                        {
                            label: 'Teplota (°C)',
                            data: temps,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Vlhkost (%)',
                            data: humidities,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Teplota (°C)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Vlhkost (%)'
                            },
                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });
        }
        
        function showError(message) {
            document.getElementById('errorContainer').innerHTML = '<div class="error">' + message + '</div>';
        }
        
        // Automatické aktualizace každých 30 sekund
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
